apiVersion: database.opzkit.io/v1alpha1
kind: Database
metadata:
  name: myapp-database
spec:
  engine: postgres
  databaseName: myapp_db

  # Source of the admin DSN. Pick one of:
  #   connectionString.kubernetes  — admin DSN in a Secret in the same namespace
  #   connectionString.aws         — admin DSN in AWS Secrets Manager
  connectionString:
    kubernetes:
      name: postgres-admin-connection
      key: connectionString          # optional, defaults to "connectionString"

  retainOnDelete: false

  # Destination for the generated user credentials. Pick one of:
  #   secretBackend.aws         — AWS Secrets Manager
  #   secretBackend.kubernetes  — Kubernetes Secret in the chosen namespace
  #   secretBackend.infisical   — Infisical (Cloud or self-hosted) via Universal Auth
  secretBackend:
    aws:
      region: us-east-1
      description: "Database credentials for myapp"
      tags:
        Environment: production
        Application: myapp
