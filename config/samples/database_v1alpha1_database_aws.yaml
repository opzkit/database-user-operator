apiVersion: database.opzkit.io/v1alpha1
kind: Database
metadata:
  name: myapp-database-aws
spec:
  engine: postgres
  databaseName: myapp_db

  # Source of the admin DSN: read from AWS Secrets Manager.
  connectionString:
    aws:
      secretName: rds/admin/postgres-connection
      key: connectionString          # optional, defaults to "connectionString"
      region: us-east-1

  # Optional — defaults to databaseName
  username: myapp_user

  # Optional — defaults to rds/<engine>/<databaseName>
  secretName: rds/postgres/myapp_db

  privileges: [ALL]
  retainOnDelete: true

  # Destination for the generated user credentials.
  secretBackend:
    aws:
      region: us-east-1
      description: "Database credentials for myapp"
      tags:
        Environment: production
        Application: myapp
