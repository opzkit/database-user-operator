replicaCount: 1
image:
  repository: ghcr.io/opzkit/database-user-operator
  pullPolicy: IfNotPresent
  tag: 0.4.0
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
controllerManager:
  args:
    - '--health-probe-bind-address=:8081'
    - '--metrics-bind-address=:8080'
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10
kubeRbacProxy:
  enabled: true
  image:
    repository: quay.io/brancz/kube-rbac-proxy
    tag: >-
      v0.22.0@sha256:53d5a3911ac076d000c92362d4939a3147ba21f231edf82926c82d16dbdd8850
    pullPolicy: IfNotPresent
  args:
    - '--secure-listen-address=0.0.0.0:8443'
    - '--upstream=http://127.0.0.1:8080/'
    - '--v=0'
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 5m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
podSecurityContext:
  runAsNonRoot: true
serviceAccount:
  create: true
  annotations: {}
  name: db-operator
rbac:
  create: true
metrics:
  enabled: true
  port: 8443
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Extra env vars injected on the controller-manager container.
#
# Set SCW_ACCESS_KEY + SCW_SECRET_KEY here (typically via valueFrom +
# Secret ref) to enable the cluster-wide Scaleway IAM auth path for
# secretBackend.scaleway / connectionString.scaleway. When set, those
# CR fields can omit `authSecretRef` and the controller falls back to
# the pod env — mirror of the AWS backend's IRSA / instance-profile
# pattern, removes the per-namespace credential Secret.
#
# Example:
#   env:
#     - name: SCW_ACCESS_KEY
#       valueFrom:
#         secretKeyRef:
#           name: dbuo-scaleway-creds
#           key: access_key
#     - name: SCW_SECRET_KEY
#       valueFrom:
#         secretKeyRef:
#           name: dbuo-scaleway-creds
#           key: secret_key
env: []
extraVolumes: []
extraVolumeMounts: []
