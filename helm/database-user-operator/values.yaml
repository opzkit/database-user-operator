replicaCount: 1
image:
  repository: ghcr.io/opzkit/database-user-operator
  pullPolicy: IfNotPresent
  tag: 0.6.0
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
controllerManager:
  args:
    - '--health-probe-bind-address=:8081'
    - '--metrics-bind-address=:8080'
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10
kubeRbacProxy:
  enabled: true
  image:
    repository: quay.io/brancz/kube-rbac-proxy
    tag: >-
      v0.22.0@sha256:53d5a3911ac076d000c92362d4939a3147ba21f231edf82926c82d16dbdd8850
    pullPolicy: IfNotPresent
  args:
    - '--secure-listen-address=0.0.0.0:8443'
    - '--upstream=http://127.0.0.1:8080/'
    - '--v=0'
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 5m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
podSecurityContext:
  runAsNonRoot: true
serviceAccount:
  create: true
  annotations: {}
  name: db-operator
rbac:
  create: true
metrics:
  enabled: true
  port: 8443
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Extra environment variables for the operator pod.
#
# Scaleway operator-level defaults: when a Database CR omits
# spec.{secretBackend,connectionString}.scaleway.projectID / .region,
# the operator falls back to SCW_DEFAULT_PROJECT_ID / SCW_DEFAULT_REGION
# set here. This scopes every CR to the one Project/region the operator
# runs against (per-CR overrides still win). Pair with SCW_ACCESS_KEY /
# SCW_SECRET_KEY for the operator-wide IAM key fallback.
#
#   env:
#     - name: SCW_DEFAULT_PROJECT_ID
#       value: "5a339eb9-920f-4256-bbf2-d9ae6e0fb676"
#     - name: SCW_DEFAULT_REGION
#       value: "fr-par"
env: []
extraVolumes: []
extraVolumeMounts: []
