  connectionString: "postgresql://dbuo_admin:dbuo_admin_pw@postgres-18.databases.svc.cluster.local:5432/postgres?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-14
  namespace: databases
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-14
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-15
  namespace: databases
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-15
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-16
  namespace: databases
