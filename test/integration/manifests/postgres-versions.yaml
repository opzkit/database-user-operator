      targetPort: 5432
  selector:
    app: postgres-18
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-14
  namespace: databases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-14
  template:
    metadata:
      labels:
        app: postgres-14
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: postgres123
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
