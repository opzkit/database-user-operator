name: Verify Manifests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify-manifests:
    name: Verify Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate manifests
        run: |
          make controller-gen
          make manifests
          make generate

      - name: Verify no changes
        run: |
          git diff --exit-code
          if [ $? -ne 0 ]; then
            echo "Generated files are out of date. Please run 'make manifests generate' and commit the changes."
            exit 1
          fi
