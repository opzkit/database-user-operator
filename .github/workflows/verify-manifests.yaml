name: Verify Manifests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify-manifests:
    name: Verify Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate manifests
        run: |
          make controller-gen
          make manifests
          make generate

      - name: Verify no changes
        run: |
          git diff --exit-code
          if [ $? -ne 0 ]; then
            echo "Generated files are out of date. Please run 'make manifests generate' and commit the changes."
            exit 1
          fi
