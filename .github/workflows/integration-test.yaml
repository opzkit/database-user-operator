name: Integration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build operator image with cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: database-user-operator:test
          build-args: ENABLE_COVERAGE=true
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup integration test environment
        env:
          SKIP_OPERATOR_BUILD: "true"
        run: make integration-setup

      - name: Run integration tests
        run: make integration-run

      - name: Merge coverage data
        if: always()
        run: make merge-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: always()
        with:
          files: ./coverage/merged.out
          flags: merged
          fail_ci_if_error: false

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info dump || true
          echo ""
          echo "=== Operator Logs ==="
          kubectl logs -n db-system -l app.kubernetes.io/name=database-user-operator --tail=500 || true
          echo ""
          echo "=== Database Pods ==="
          kubectl get pods -n databases || true
          echo ""
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' || true

      - name: Export kind logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/kind-logs
          kind export logs /tmp/kind-logs --name database-operator-test || true

      - name: Upload kind logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: kind-logs
          path: /tmp/kind-logs
          retention-days: 7

      - name: Cleanup kind cluster
        if: always()
        run: make integration-teardown
