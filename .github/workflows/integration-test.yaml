name: Integration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build operator image with cache
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          tags: database-user-operator:test
          build-args: ENABLE_COVERAGE=true
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup integration test environment
        env:
          SKIP_OPERATOR_BUILD: "true"
        run: make integration-setup

      - name: Run integration tests
        run: make integration-run

      - name: Merge coverage data
        if: always()
        run: make merge-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        if: always()
        with:
          files: ./coverage/merged.out
          flags: merged
          fail_ci_if_error: false

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info dump || true
          echo ""
          echo "=== Operator Logs ==="
          kubectl logs -n db-system -l app.kubernetes.io/name=database-user-operator --tail=500 || true
          echo ""
          echo "=== Database Pods ==="
          kubectl get pods -n databases || true
          echo ""
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' || true

      - name: Export kind logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/kind-logs
          kind export logs /tmp/kind-logs --name database-operator-test || true

      - name: Upload kind logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: kind-logs
          path: /tmp/kind-logs
          retention-days: 7

      - name: Cleanup kind cluster
        if: always()
        run: make integration-teardown
